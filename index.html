  --yellow:#EFDF00;
  --blue:#1281DF;
  --orange:#EE8A1D;
  --flame:#E8522E;
  --pink:#FF7BAC;
  --mint:#3DDC97;
  --line:#CBD8E6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  margin:0;min-height:100vh;overflow-x:hidden;color:#000;
  background:linear-gradient(165deg,#25A0FF 0%,#1281DF 42%,#0B5FB3 100%);
  font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  font-weight:500;font-size:18px;line-height:1.5;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px 64px}

/* ---------- خلفية: أشكال عائمة ---------- */
.decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.shape{
  position:absolute;will-change:transform;
  animation:floaty var(--d,8s) ease-in-out var(--delay,0s) infinite alternate;
}
@keyframes floaty{
  from{transform:translate(0,0) rotate(var(--r0,0deg))}
  to{transform:translate(var(--dx,30px),var(--dy,-40px)) rotate(var(--r1,40deg))}
}

/* ---------- الشعار المتحرك ---------- */
.stage{position:relative;display:grid;place-items:center;padding:6px 0}
.rays-wrap{
  position:absolute;left:50%;top:50%;width:960px;height:960px;margin:-480px 0 0 -480px;
  -webkit-mask-image:radial-gradient(circle closest-side,#000 22%,transparent 100%);
  mask-image:radial-gradient(circle closest-side,#000 22%,transparent 100%);
  pointer-events:none;overflow:hidden;
}
.rays{
  width:100%;height:100%;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.26) 0 7.5deg,rgba(255,255,255,0) 7.5deg 15deg);
  animation:spin 70s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{
  position:relative;z-index:1;width:min(340px,80vw);aspect-ratio:1;border-radius:50%;
  background:#fff;border:4px solid #000;box-shadow:8px 8px 0 #000;
  display:grid;place-items:center;overflow:hidden;
}
.badge .logo3d{height:74%}
.logo3d{position:relative;aspect-ratio:615/620;cursor:pointer}
.lyr{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:contain;will-change:transform}
.lyr-fry{
  background-image:var(--l-fry);transform-origin:50% 25.7%;
  animation:dropIn .9s cubic-bezier(.3,1.3,.5,1) both,bobA 3.6s ease-in-out .9s infinite;
}
.lyr-day{
  background-image:var(--l-day);transform-origin:50% 71.2%;
  animation:riseUp .9s cubic-bezier(.3,1.3,.5,1) .15s both,bobB 3.6s ease-in-out 1.1s infinite;
}
.lyr-tag{
  background-image:var(--l-tag);transform-origin:50% 96.6%;
  animation:riseIn .6s ease-out .55s both,tagPulse 2.4s ease-in-out 1.2s infinite;
}
.glow{
  position:absolute;left:45.8%;top:17.6%;width:41.1%;aspect-ratio:1;
  margin:0;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,190,60,.85) 0,rgba(255,120,30,.35) 45%,rgba(255,120,30,0) 70%);
  animation:glowPulse .9s ease-in-out 1.2s infinite alternate;opacity:.6;
}
.flame{
  position:absolute;inset:0;background-image:var(--l-flame);background-repeat:no-repeat;
  background-position:center;background-size:contain;transform-origin:45.8% 33.4%;
  animation:flamePop .5s cubic-bezier(.3,1.6,.5,1) .85s both,flicker 1s ease-in-out 1.35s infinite;
}
.logo3d.hop{animation:hop .75s ease-out}
@keyframes dropIn{
  0%{transform:translateY(-130%) scale(.85,1.15);opacity:0}
  50%{opacity:1}
  60%{transform:translateY(6%) scale(1.06,.94)}
  80%{transform:translateY(-2.5%) scale(.98,1.03)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
@keyframes riseUp{
  0%{transform:translateY(130%) scale(.85,1.15);opacity:0}
  50%{opacity:1}
  60%{transform:translateY(-6%) scale(1.06,.94)}
  80%{transform:translateY(2.5%) scale(.98,1.03)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
@keyframes bobA{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-2.5%) rotate(1.4deg)}
  75%{transform:translateY(1.5%) rotate(-1.4deg)}
}
@keyframes bobB{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(2%) rotate(-1.2deg)}
  75%{transform:translateY(-2%) rotate(1.2deg)}
}
@keyframes riseIn{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}
@keyframes tagPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes flamePop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flicker{
  0%,100%{transform:scale(1,1) skewX(0)}
  20%{transform:scale(1.03,1.07) skewX(-2.5deg)}
  40%{transform:scale(.99,1.03) skewX(1.5deg)}
  60%{transform:scale(1.04,1.1) skewX(-1deg)}
  80%{transform:scale(1,1.04) skewX(2.5deg)}
}
@keyframes glowPulse{from{opacity:.35;transform:translate(-50%,-50%) scale(.9)}to{opacity:.9;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes hop{
  0%{transform:translateY(0) scale(1)}
  25%{transform:translateY(-12%) scale(.96,1.06)}
  50%{transform:translateY(0) scale(1.07,.93)}
  75%{transform:translateY(-3%) scale(1)}
  100%{transform:translateY(0) scale(1)}
}

.hero{position:relative;text-align:center;padding:4px 0 26px}
h1{
  font-weight:800;font-size:44px;line-height:1.2;margin:22px 0 6px;
  color:var(--yellow);text-shadow:4px 4px 0 #000;
}
.sub{margin:0;font-size:20px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35)}

.panel{
  background:#fff;border:3px solid #000;border-radius:22px;
  box-shadow:7px 7px 0 #000;margin:0 0 30px;overflow:hidden;
}
.panel-head{padding:14px 22px;border-bottom:3px solid #000;font-weight:800;font-size:23px;line-height:1.3}
.h-yellow{background:var(--yellow)}
.h-orange{background:var(--orange)}
.h-flame{background:var(--flame);color:#fff}
.panel-body{padding:22px}

.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.field-name{display:block;font-weight:800;font-size:18px;margin-bottom:8px}
.opt{font-weight:500;color:#555;font-size:14px;margin-inline-start:8px}
input[type=text],input[type=tel],textarea{
  width:100%;font:inherit;font-size:21px;padding:13px 15px;
  border:3px solid #000;border-radius:14px;background:#fff;color:#000;
}
input[type=tel]{direction:ltr;text-align:right}
textarea{min-height:130px;resize:none;display:block}
input::placeholder,textarea::placeholder{color:#7a8794;font-weight:500}
input:focus,textarea:focus{outline:none;box-shadow:5px 5px 0 var(--blue)}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

.opt-btn{
  font:inherit;font-weight:800;font-size:21px;line-height:1.2;color:#000;
  min-height:64px;padding:8px 10px;background:#fff;
  border:3px solid #000;border-radius:14px;box-shadow:4px 4px 0 #000;
  cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,box-shadow .08s ease,background-color .08s ease;
}
.opt-btn[aria-checked="true"]{background:var(--yellow);transform:translate(4px,4px);box-shadow:0 0 0 #000;animation:pick .28s ease-out}
@keyframes pick{
  0%{transform:translate(0,0) scale(1)}
  55%{transform:translate(4px,4px) scale(1.09)}
  100%{transform:translate(4px,4px) scale(1)}
}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.q{
  display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:12px 20px;align-items:center;
  padding:18px 22px;margin:0 -22px;border-top:2px solid var(--line);
}
.q:first-child{border-top:0;padding-top:4px}
.q:last-child{padding-bottom:4px}
.q-label{font-weight:800;font-size:21px;line-height:1.3}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.block{padding:18px 22px;margin:0 -22px;border-top:2px solid var(--line)}
.block:first-child{border-top:0;padding-top:4px}
.block:last-child{padding-bottom:4px}
.block .q-label{margin-bottom:14px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.scale .opt-btn{padding:4px;font-size:23px;min-height:66px}
.scale .opt-btn[aria-checked="true"]{background:var(--blue);color:#fff}
.scale-ends{display:flex;justify-content:space-between;margin-top:12px;font-size:16px;color:#222}

.q.missing,.block.missing{background:#FFE7C7;box-shadow:inset -8px 0 0 var(--flame)}

.error{
  display:none;margin:0 0 18px;padding:14px 18px;background:#FFE7C7;
  border:3px solid #000;border-radius:14px;font-weight:800;font-size:19px;
}
.error.show{display:block}
.submit{
  display:block;width:100%;font:inherit;font-weight:800;font-size:30px;min-height:80px;
  background:var(--yellow);color:#000;border:3px solid #000;border-radius:22px;
  box-shadow:6px 6px 0 #000;cursor:pointer;touch-action:manipulation;
  transition:transform .08s ease,box-shadow .08s ease;
}
.submit.ready{animation:ring 1.4s ease-out infinite}
@keyframes ring{
  0%{box-shadow:6px 6px 0 #000,0 0 0 0 rgba(255,255,255,.95)}
  100%{box-shadow:6px 6px 0 #000,0 0 0 20px rgba(255,255,255,0)}
}
.submit:active{transform:translate(6px,6px);box-shadow:0 0 0 #000}
.submit[disabled]{opacity:.6;cursor:default}
.pending{text-align:center;color:#fff;font-size:14px;margin-top:22px;min-height:22px}

.thanks{
  position:fixed;inset:0;z-index:10;display:none;overflow:hidden;
  background:linear-gradient(165deg,#25A0FF 0%,#1281DF 42%,#0B5FB3 100%);
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;cursor:pointer;
}
.thanks.show{display:flex}
.thanks .badge{width:min(44vh,360px,80vw)}
.thanks h2{
  position:relative;z-index:1;font-weight:800;font-size:clamp(46px,8vw,76px);line-height:1.15;
  margin:26px 0 8px;color:var(--yellow);text-shadow:5px 5px 0 #000;
}
.thanks p{position:relative;z-index:1;margin:0;font-size:clamp(20px,3vw,27px);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.bar{position:relative;z-index:1;width:min(420px,80%);height:16px;margin-top:32px;background:#fff;border:3px solid #000;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);transform-origin:right center;animation:drain var(--thanks-ms,6s) linear forwards}
.tap{position:relative;z-index:1;margin-top:14px;font-size:15px;color:#fff}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{
  position:absolute;top:-30px;border:2px solid #000;
  animation:fall var(--t,4s) linear var(--dl,0s) infinite;
}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(115vh) rotate(var(--rot,720deg))}}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){
  .rays,.shape,.confetti i,.lyr,.flame,.glow,.logo3d.hop,.submit.ready,.opt-btn,.bar i{animation:none!important}
  .opt-btn,.submit{transition:none}
}

@media (max-width:760px){
  .fields{grid-template-columns:1fr}
  .chips{grid-template-columns:repeat(2,1fr)}
  .q{grid-template-columns:1fr}
  .scale{grid-template-columns:repeat(5,1fr)}
  h1{font-size:30px}
}
@media (max-width:480px){
  .levels{grid-template-columns:repeat(2,1fr)}
}

<body>
<div class="decor" id="decor" aria-hidden="true"></div>
<div class="wrap">

  <header class="hero">
    <div class="stage">
      <div class="rays-wrap"><div class="rays"></div></div>
      <div class="badge"><div class="logo3d" role="img" aria-label="Fryday - Fries and Pastry"><div class="lyr lyr-fry"><div class="glow"></div><div class="flame"></div></div><div class="lyr lyr-day"></div><div class="lyr lyr-tag"></div></div></div>
    </div>
    <h1>رأيك يهمنا</h1>

  <section class="panel">

      <div class="fields">

          <span class="field-name">الاسم<span class="opt">اختياري</span></span>

</div>

<script>
(function () {
  'use strict';

  /* ===== الإعدادات ===== */
  var CONFIG = {
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxfQoidTHrSCoEFTFWHDom8Y4IbNosYvobRDR8F0W6wh3YqOe6y6TXBTvee15NUio8h/exec',
    THANKS_MS: 6000,      // مدة شاشة الشكر
    IDLE_MS: 180000       // تفريغ الاستمارة تلقائياً بعد 3 دقائق خمول
  };

  var SOURCES = ['إعلان', 'سوشيال ميديا', 'صديق أو عائلة', 'Google Maps', 'مررت بالمكان', 'أخرى'];
  var LEVELS = ['سيء', 'متوسط', 'جيد', 'ممتاز'];
  var QUESTIONS = [
    { key: 'cleanliness', label: 'نظافة المطعم' },
    { key: 'speed',       label: 'سرعة وصول الطلب' },
    { key: 'staff',       label: 'ودودية الموظفين' },
    { key: 'food',        label: 'جودة الطعام' },
    { key: 'drinks',      label: 'جودة المشروبات' },
    { key: 'desserts',    label: 'جودة الحلويات' },
    { key: 'menu',        label: 'تنوع القائمة' }
  ];
  var SCALES = [
    { key: 'foodScore', label: 'كيف تقيّم جودة الطعام بشكل عام؟', low: 'ضعيفة جداً', high: 'ممتازة' },
    { key: 'recommend', label: 'ما احتمال أن توصي بنا لأصدقائك وعائلتك؟', low: 'لن أوصي', high: 'سأوصي بالتأكيد' }
  ];

  var state = { source: '', answers: {} };
  var submitting = false;
  var dirty = false;
  var thanksTimer = null;
  var idleTimer = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function makeBtn(text, value) {
    var b = el('button', 'opt-btn', text);
    b.type = 'button';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', 'false');
    b.setAttribute('data-value', value);
    return b;
  }
  function selectIn(container, btn, allowClear) {
    var wasOn = btn.getAttribute('aria-checked') === 'true';
    var all = container.querySelectorAll('.opt-btn');
    for (var i = 0; i < all.length; i++) all[i].setAttribute('aria-checked', 'false');
    if (wasOn && allowClear) return '';
    btn.setAttribute('aria-checked', 'true');
    return btn.getAttribute('data-value');
  }
  function normDigits(s) {
    return String(s)
      .replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 1632); })
      .replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 1776); });
  }

  /* ===== بناء الأسئلة ===== */
  function buildSources() {
    var box = $('chips');
    SOURCES.forEach(function (s) { box.appendChild(makeBtn(s, s)); });
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.opt-btn') : null;
      if (!b || !box.contains(b)) return;
      state.source = selectIn(box, b, true);
      markDirty();
    });
  }

  function buildLevels() {
    var host = $('levels');
    QUESTIONS.forEach(function (q) {
      var row = el('div', 'q');
      row.id = 'row-' + q.key;
      row.appendChild(el('div', 'q-label', q.label));
      var group = el('div', 'levels');
      group.setAttribute('role', 'radiogroup');
      group.setAttribute('aria-label', q.label);
      LEVELS.forEach(function (l) { group.appendChild(makeBtn(l, l)); });
      group.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.opt-btn') : null;
        if (!b || !group.contains(b)) return;
        state.answers[q.key] = selectIn(group, b, false);
        row.classList.remove('missing');
        hideErrorIfDone();
        markDirty();
      });
      row.appendChild(group);
      host.appendChild(row);
    });
  }

  function buildScales() {
    var host = $('scales');
    SCALES.forEach(function (s) {
      var block = el('div', 'block');
      block.id = 'row-' + s.key;
      block.appendChild(el('div', 'q-label', s.label));
      var group = el('div', 'scale');
      group.setAttribute('role', 'radiogroup');
      group.setAttribute('aria-label', s.label);
      for (var n = 1; n <= 10; n++) group.appendChild(makeBtn(String(n), String(n)));
      group.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.opt-btn') : null;
        if (!b || !group.contains(b)) return;
        state.answers[s.key] = Number(selectIn(group, b, false));
        block.classList.remove('missing');
        hideErrorIfDone();
        markDirty();
      });
      block.appendChild(group);
      var ends = el('div', 'scale-ends');
      ends.appendChild(el('span', '', s.low));
      ends.appendChild(el('span', '', s.high));
      block.appendChild(ends);
      host.appendChild(block);
    });
  }

  /* ===== التحقق والإرسال ===== */
  function requiredKeys() {
    return QUESTIONS.map(function (q) { return q.key; })
      .concat(SCALES.map(function (s) { return s.key; }));
  }

  function allAnswered() {
    return requiredKeys().every(function (k) {
      return state.answers[k] !== undefined && state.answers[k] !== '';
    });
  }
  function hideErrorIfDone() {
    if (allAnswered()) $('error').classList.remove('show');
    $('submit').classList.toggle('ready', allAnswered());
  }

  function validate() {
    var firstMissing = null;
    requiredKeys().forEach(function (k) {
      var row = $('row-' + k);
      var ok = state.answers[k] !== undefined && state.answers[k] !== '';
      row.classList.toggle('missing', !ok);
      if (!ok && !firstMissing) firstMissing = row;
    });
    $('error').classList.toggle('show', !!firstMissing);
    if (firstMissing) firstMissing.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return !firstMissing;
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function collect() {
    var a = state.answers;
    return {
      id: newId(),
      ts: new Date().toISOString(),
      name: $('f-name').value.trim(),
      order: normDigits($('f-order').value.trim()),
      phone: normDigits($('f-phone').value.replace(/\s+/g, '')),
      source: state.source,
      cleanliness: a.cleanliness, speed: a.speed, staff: a.staff,
      food: a.food, drinks: a.drinks, desserts: a.desserts, menu: a.menu,
      foodScore: a.foodScore, recommend: a.recommend,
      notes: $('f-notes').value.trim()
    };
  }

  /* ===== طابور الإرسال (يعمل بدون إنترنت) ===== */
  var QKEY = 'fryday_queue_v1';
  var memQueue = null;
  function loadQ() {
    try { var r = localStorage.getItem(QKEY); return r ? JSON.parse(r) : []; }
    catch (e) { return memQueue || []; }
  }
  function saveQ(q) {
    try { localStorage.setItem(QKEY, JSON.stringify(q)); memQueue = null; }
    catch (e) { memQueue = q; }
  }
  function isConfigured() {
    return typeof CONFIG.APPS_SCRIPT_URL === 'string' && CONFIG.APPS_SCRIPT_URL.indexOf('https://') === 0;
  }
  function renderPending() {
    var n = loadQ().length;
    $('pending').textContent = n > 0 ? ('تقييمات بانتظار الإرسال: ' + n) : '';
  }

  function sendOne(item) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 20000);
    return fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(item),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function () { clearTimeout(t); return true; })
      .catch(function () { clearTimeout(t); return false; });
  }

  var flushing = false;
  function flush() {
    if (flushing) return;
    if (!isConfigured()) { renderPending(); return; }
    var q = loadQ();
    if (!q.length) { renderPending(); return; }
    flushing = true;
    var item = q[0];
    sendOne(item).then(function (ok) {
      if (ok) {
        saveQ(loadQ().filter(function (x) { return x.id !== item.id; }));
      }
      flushing = false;
      renderPending();
      if (ok) flush();
    });
  }

  /* ===== شاشة الشكر وإعادة الضبط ===== */
  function showThanks() {
    var bar = $('bar-i');
    var fresh = bar.cloneNode(false);
    fresh.style.setProperty('--thanks-ms', (CONFIG.THANKS_MS / 1000) + 's');
    bar.parentNode.replaceChild(fresh, bar);
    fresh.id = 'bar-i';
    $('thanks').classList.add('show');
    clearTimeout(thanksTimer);
    thanksTimer = setTimeout(hideThanks, CONFIG.THANKS_MS);
  }
  function hideThanks() {
    clearTimeout(thanksTimer);
    $('thanks').classList.remove('show');
    resetForm();
    window.scrollTo(0, 0);
  }
  function resetForm() {
    state = { source: '', answers: {} };
    var on = document.querySelectorAll('.opt-btn[aria-checked="true"]');
    for (var i = 0; i < on.length; i++) on[i].setAttribute('aria-checked', 'false');
    ['f-name', 'f-order', 'f-phone', 'f-notes'].forEach(function (id) { $(id).value = ''; });
    var miss = document.querySelectorAll('.missing');
    for (var j = 0; j < miss.length; j++) miss[j].classList.remove('missing');
    $('error').classList.remove('show');
    $('submit').disabled = false;
    $('submit').classList.remove('ready');
    $('submit').textContent = 'أرسل التقييم';
    submitting = false;
    dirty = false;
    clearTimeout(idleTimer);
  }

  /* ===== تفريغ تلقائي عند الخمول ===== */
  function markDirty() { dirty = true; armIdle(); }
  function armIdle() {
    clearTimeout(idleTimer);
    if (!dirty) return;
    idleTimer = setTimeout(function () {
      if (dirty && !$('thanks').classList.contains('show')) {
        resetForm();
        window.scrollTo(0, 0);
      }
    }, CONFIG.IDLE_MS);
  }

  /* ===== الخلفية المتحركة ===== */
  var PALETTE = ['#EFDF00', '#EE8A1D', '#FF7BAC', '#FFFFFF', '#3DDC97', '#E8522E'];
  var DOUGH = '#EBA23C', DARK = '#7A4A2B', CREAM = '#FFF3C4';
  var SHAPES = {
    stick: '<rect x="36" y="4" width="28" height="92" rx="9" fill="C" stroke="#000" stroke-width="7"/>',
    tri: '<polygon points="50,8 94,88 6,88" fill="C" stroke="#000" stroke-width="7" stroke-linejoin="round"/>',
    plus: '<path d="M38 6h24v32h32v24H62v32H38V62H6V38h32z" fill="C" stroke="#000" stroke-width="6" stroke-linejoin="round"/>',

    croissant:
      '<g stroke="#000" stroke-width="5" stroke-linejoin="round" fill="' + DOUGH + '">' +
      '<ellipse cx="14" cy="68" rx="8.5" ry="17" transform="rotate(-20 14 68)"/>' +
      '<ellipse cx="86" cy="68" rx="8.5" ry="17" transform="rotate(20 86 68)"/>' +
      '<ellipse cx="29" cy="48" rx="15" ry="23" transform="rotate(-30 29 48)"/>' +
      '<ellipse cx="71" cy="48" rx="15" ry="23" transform="rotate(30 71 48)"/>' +
      '<ellipse cx="50" cy="44" rx="18" ry="28"/></g>' +
      '<g fill="none" stroke="#B8661C" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M40 36q10 5 20 0M40 50q10 5 20 0"/></g>' +
      '<path d="M43 24q7-6 14 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>',

    donut:
      '<path fill-rule="evenodd" fill="' + DOUGH + '" stroke="#000" stroke-width="5" d="M50 8a42 42 0 1 0 .01 0zM50 38a12 12 0 1 1-.01 0z"/>' +
      '<path fill-rule="evenodd" fill="C" stroke="#000" stroke-width="4" d="M50 15c8 0 10 3 17 4 8 2 17 9 17 22 0 6-3 8-3 13 0 8-8 12-12 17-6 6-13 9-19 9s-14-3-19-9c-5-5-12-9-12-17 0-5-3-7-3-13 0-13 9-20 17-22 7-1 9-4 17-4zM50 38a12 12 0 1 1-.01 0z"/>' +
      '<g stroke-width="4" stroke-linecap="round"><path d="M30 34l5-3" stroke="#fff"/><path d="M66 32l5 3" stroke="#EFDF00"/><path d="M26 56l5 2" stroke="#3DDC97"/><path d="M72 58l5-2" stroke="#fff"/><path d="M42 78l3-5" stroke="#EFDF00"/><path d="M58 76l3 5" stroke="#3DDC97"/></g>',

    cat:
      '<polygon points="12,44 10,6 44,24" fill="C" stroke="#000" stroke-width="5" stroke-linejoin="round"/>' +
      '<polygon points="88,44 90,6 56,24" fill="C" stroke="#000" stroke-width="5" stroke-linejoin="round"/>' +
      '<polygon points="17,36 16,16 33,26" fill="#FF7BAC"/><polygon points="83,36 84,16 67,26" fill="#FF7BAC"/>' +
      '<ellipse cx="50" cy="58" rx="40" ry="33" fill="C" stroke="#000" stroke-width="5"/>' +
      '<ellipse cx="34" cy="54" rx="6" ry="8" fill="#000"/><ellipse cx="66" cy="54" rx="6" ry="8" fill="#000"/>' +
      '<circle cx="36" cy="51" r="2.4" fill="#fff"/><circle cx="68" cy="51" r="2.4" fill="#fff"/>' +
      '<polygon points="45,65 55,65 50,71" fill="#FF7BAC" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M50 71q-5 8-12 4M50 71q5 8 12 4" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>' +
      '<g stroke="#000" stroke-width="3" stroke-linecap="round"><path d="M8 62l16 2M8 72l16-4M92 62l-16 2M92 72l-16-4"/></g>',

    burger:
      '<g stroke="#000" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">' +
      '<path d="M8 74h84v5q0 13-12 13H20Q8 92 8 79z" fill="' + DOUGH + '"/>' +
      '<rect x="8" y="55" width="84" height="19" rx="9.5" fill="' + DARK + '"/>' +
      '<path d="M8 46h84v10H72l-6 13-6-13H8z" fill="#EFDF00"/>' +
      '<path d="M6 42q8-10 16 0t16 0 16 0 16 0 16 0v8H6z" fill="#3DDC97"/>' +
      '<path d="M8 36Q8 8 50 8t42 28z" fill="' + DOUGH + '"/></g>' +
      '<g fill="' + CREAM + '"><ellipse cx="31" cy="23" rx="4" ry="2.4" transform="rotate(-25 31 23)"/><ellipse cx="50" cy="17" rx="4" ry="2.4"/><ellipse cx="69" cy="23" rx="4" ry="2.4" transform="rotate(25 69 23)"/><ellipse cx="41" cy="30" rx="4" ry="2.4" transform="rotate(-10 41 30)"/><ellipse cx="59" cy="30" rx="4" ry="2.4" transform="rotate(10 59 30)"/></g>',

    chicken:
      '<path d="M54 46L82 18" stroke="#000" stroke-width="15" stroke-linecap="round"/>' +
      '<path d="M54 46L82 18" stroke="#fff" stroke-width="8" stroke-linecap="round"/>' +
      '<circle cx="90" cy="14" r="7.5" fill="#fff" stroke="#000" stroke-width="4.5"/>' +
      '<circle cx="82" cy="8" r="7.5" fill="#fff" stroke="#000" stroke-width="4.5"/>' +
      '<circle cx="90" cy="14" r="4" fill="#fff"/>' +
      '<ellipse cx="38" cy="62" rx="31" ry="25" transform="rotate(-42 38 62)" fill="#E08A2C" stroke="#000" stroke-width="5"/>' +
      '<g fill="#B8661C"><circle cx="28" cy="64" r="3.4"/><circle cx="40" cy="74" r="3.2"/><circle cx="46" cy="56" r="3.4"/><circle cx="32" cy="50" r="2.8"/><circle cx="52" cy="68" r="2.8"/><circle cx="20" cy="76" r="2.6"/></g>' +
      '<path d="M22 52q8-14 24-15" fill="none" stroke="#FFD27A" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>'
  };
  var SHAPE_ORDER = ['burger', 'cat', 'croissant', 'donut', 'chicken', 'stick', 'cat', 'donut', 'burger', 'croissant', 'chicken', 'tri', 'cat', 'donut', 'stick', 'plus', 'burger', 'croissant', 'chicken', 'cat'];
  var CAT_COLORS = ['#EE8A1D', '#FFFFFF', '#EFDF00', '#FF7BAC'];
  var ICING = ['#FF7BAC', '#FFFFFF', '#3DDC97', '#EFDF00'];
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function buildDecor() {
    var host = $('decor');
    for (var i = 0; i < 20; i++) {
      var type = SHAPE_ORDER[i % SHAPE_ORDER.length];
      var color = type === 'cat' ? CAT_COLORS[i % CAT_COLORS.length]
                : type === 'donut' ? ICING[i % ICING.length]
                : PALETTE[(i * 5 + 1) % PALETTE.length];
      var s = el('div', 'shape');
      var size = (type === 'stick' || type === 'tri' || type === 'plus') ? rnd(30, 56) : rnd(52, 84);
      s.style.width = s.style.height = size + 'px';
      s.style.left = (i % 2 ? rnd(0, 12) : rnd(84, 94)) + '%';
      s.style.top = rnd(0, 94) + '%';
      s.style.setProperty('--d', rnd(5, 11) + 's');
      s.style.setProperty('--delay', (-rnd(0, 8)) + 's');
      s.style.setProperty('--dx', rnd(-60, 60) + 'px');
      s.style.setProperty('--dy', rnd(-70, 70) + 'px');
      s.style.setProperty('--r0', rnd(-30, 30) + 'deg');
      s.style.setProperty('--r1', rnd(-120, 120) + 'deg');
      s.innerHTML = '<svg viewBox="0 0 100 100" width="100%" height="100%">' +
        SHAPES[type].replace(/"C"/g, '"' + color + '"') + '</svg>';
      host.appendChild(s);
    }
  }

  function buildConfetti() {
    var host = $('confetti');
    for (var i = 0; i < 42; i++) {
      var p = el('i');
      var w = rnd(9, 17);
      p.style.width = w + 'px';
      p.style.height = rnd(12, 24) + 'px';
      p.style.left = rnd(0, 98) + '%';
      p.style.background = PALETTE[i % PALETTE.length];
      p.style.borderRadius = (i % 3 === 0) ? '50%' : '3px';
      p.style.setProperty('--t', rnd(3, 6) + 's');
      p.style.setProperty('--dl', (-rnd(0, 6)) + 's');
      p.style.setProperty('--rot', rnd(360, 1080) + 'deg');
      host.appendChild(p);
    }
  }

  function bindLogos() {
    var logos = document.querySelectorAll('.logo3d');
    Array.prototype.forEach.call(logos, function (lg) {
      lg.addEventListener('click', function (e) {
        e.stopPropagation();
        lg.classList.remove('hop');
        void lg.offsetWidth;
        lg.classList.add('hop');
        setTimeout(function () { lg.classList.remove('hop'); }, 800);
      });
    });
  }

  /* ===== الأحداث ===== */
  function onSubmit() {
    if (submitting) return;
    if (!validate()) return;
    submitting = true;
    $('submit').disabled = true;
    $('submit').textContent = 'جاري الإرسال';
    var q = loadQ();
    q.push(collect());
    saveQ(q);
    renderPending();
    showThanks();
    flush();
  }

  function init() {
    buildDecor();
    buildConfetti();
    bindLogos();
    buildSources();
    buildLevels();
    buildScales();

    $('submit').addEventListener('click', onSubmit);
    $('thanks').addEventListener('click', hideThanks);
    ['f-name', 'f-order', 'f-phone', 'f-notes'].forEach(function (id) {
      $(id).addEventListener('input', markDirty);
    });
    document.addEventListener('pointerdown', armIdle);
    document.addEventListener('keydown', armIdle);

    window.addEventListener('online', flush);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) flush(); });
    setInterval(flush, 60000);

    renderPending();
    flush();

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
